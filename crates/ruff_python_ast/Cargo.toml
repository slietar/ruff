[package]
name = "ruff_python_ast"
version = "0.0.22"
edition = "2024"
description = "This is an internal component crate of Ruff"

[package.metadata.cargo-shear]
# Used via `CacheKey` macro expansion.
ignored = ["ruff_cache"]

[lib]

[dependencies]
hashbrown = { version = "0.17.0", default-features = false, features = ["inline-more"] }
spin = { version = "0.10", default-features = false, features = ["lazy", "once"] }
ruff_python_trivia = { path = "../ruff_python_trivia" }
ruff_source_file = { path = "../ruff_source_file" }
ruff_text_size = { path = "../ruff_text_size" }

aho-corasick = { version = "1.1.3", default-features = false, features = ["perf-literal"] }
arrayvec = { version = "0.7.6", default-features = false, features = [] }
bitflags = { version = "2.5.0", default-features = false, features = [] }
char_str = { version = "0.0.4", default-features = false, features = [] }
compact_str = { version = "0.10.0", default-features = false, features = [] }
get-size2 = { version = "0.11.0", default-features = false, features = ["alloc", "derive", "compact-str", "hashbrown"], optional = true }
is-macro = { version = "0.3.5", default-features = false, features = [] }
memchr = { version = "2.7.1", default-features = false, features = ["alloc"] }
rustc-hash = { version = "2.0.0", default-features = false, features = [] }
thiserror = { version = "2.0.0", default-features = false, features = [] }
thin-vec = { version = "0.2.14", default-features = false, features = [] }

[features]
std = []
get-size = ["dep:get-size2", "char_str/get-size", "ruff_text_size/get-size"]

[lints.rust]
# Features whose dependencies were removed in this copy (serde, salsa, ...).
unexpected_cfgs = "allow"
