[package]
name = "ruff_python_parser"
version = "0.0.22"
edition = "2024"
description = "This is an internal component crate of Ruff"

[lib]

[dependencies]
ruff_python_ast = { path = "../ruff_python_ast" }
ruff_python_trivia = { path = "../ruff_python_trivia" }
ruff_text_size = { path = "../ruff_text_size" }
ruff_unicode_names2 = { path = "../ruff_unicode_names2" }

bitflags = { version = "2.5.0", default-features = false, features = [] }
bstr = { version = "1.9.1", default-features = false, features = ["alloc"] }
get-size2 = { version = "0.11.0", default-features = false, features = ["alloc", "derive", "compact-str", "hashbrown"], optional = true }
hashbrown = { version = "0.17.0", default-features = false, features = ["inline-more", "default-hasher"] }
memchr = { version = "2.7.1", default-features = false, features = ["alloc"] }
rustc-hash = { version = "2.0.0", default-features = false, features = [] }
static_assertions = { version = "1.1.0", default-features = false, features = [] }
stacker = { version = "0.1.24", default-features = false, features = [], optional = true }
thin-vec = { version = "0.2.14", default-features = false, features = [] }
unicode-ident = { version = "1.0.12", default-features = false, features = [] }
unicode-normalization = { version = "0.1.23", default-features = false, features = [] }

[features]
stacker = ["dep:stacker"]
get-size = ["dep:get-size2", "ruff_python_ast/get-size", "ruff_text_size/get-size"]

[lints.rust]
# Features whose dependencies were removed in this copy (serde, salsa, ...).
unexpected_cfgs = "allow"
