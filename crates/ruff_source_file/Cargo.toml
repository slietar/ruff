[package]
name = "ruff_source_file"
version = "0.0.22"
edition = "2024"
description = "This is an internal component crate of Ruff"

[lib]

[dependencies]
spin = { version = "0.10", default-features = false, features = ["once"] }
ruff_text_size = { path = "../ruff_text_size" }

get-size2 = { version = "0.11.0", default-features = false, features = ["alloc", "derive", "compact-str", "hashbrown"], optional = true }
memchr = { version = "2.7.1", default-features = false, features = ["alloc"] }

[features]
get-size = ["dep:get-size2", "ruff_text_size/get-size"]

[lints.rust]
# Features whose dependencies were removed in this copy (serde, salsa, ...).
unexpected_cfgs = "allow"
