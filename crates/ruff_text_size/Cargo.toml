[package]
name = "ruff_text_size"
version = "0.0.22"
edition = "2024"
description = "This is an internal component crate of Ruff"

[dependencies]
get-size2 = { version = "0.11.0", default-features = false, features = ["alloc", "derive", "compact-str", "hashbrown"], optional = true }

[features]
get-size = ["dep:get-size2"]

[lib]
test = false

[lints.rust]
# Features whose dependencies were removed in this copy (serde, salsa, ...).
unexpected_cfgs = "allow"
